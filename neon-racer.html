<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON DRIFT — Retro Racer</title>
<style>
  :root{
    --bg-top:#0a0620;
    --bg-bottom:#1a0b2e;
    --grid:#3d1a6b;
    --cyan:#00f0ff;
    --magenta:#ff2e97;
    --purple:#7b2ff7;
    --yellow:#ffe14d;
    --sun-top:#ff6ad5;
    --sun-bottom:#ffb347;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg-top);
    font-family:'Courier New', monospace;
    touch-action:none;
    user-select:none;
  }
  #wrap{
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #241242 0%, #0a0620 70%);
  }
  canvas{
    display:block;
    background:#0a0620;
    box-shadow:0 0 60px rgba(123,47,247,0.55), 0 0 120px rgba(255,46,151,0.25);
    max-width:100%;
    max-height:100%;
  }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:14px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:0 18px; pointer-events:none;
    font-family:'Courier New', monospace;
  }
  .hud-block{
    color:var(--cyan);
    text-shadow:0 0 6px var(--cyan), 0 0 14px var(--cyan);
    font-size:13px; letter-spacing:2px; text-transform:uppercase;
  }
  .hud-value{
    font-size:26px; font-weight:bold; line-height:1.1;
    color:#fff;
    text-shadow:0 0 8px var(--cyan), 0 0 18px var(--cyan);
  }
  #hud .right .hud-value{
    color:var(--magenta);
    text-shadow:0 0 8px var(--magenta), 0 0 18px var(--magenta);
  }
  .right{text-align:right;}

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(8,4,20,0.86);
    text-align:center; padding:24px;
    gap:14px;
  }
  .hidden{display:none !important;}
  .title{
    font-size:clamp(30px, 8vw, 54px);
    font-weight:bold; letter-spacing:6px;
    color:#fff;
    text-shadow:0 0 6px #fff, 0 0 20px var(--magenta), 0 0 40px var(--purple);
    margin:0;
  }
  .subtitle{
    color:var(--cyan);
    letter-spacing:3px; font-size:clamp(11px,3vw,14px);
    text-shadow:0 0 8px var(--cyan);
    margin:0 0 6px 0;
  }
  .btn{
    font-family:'Courier New', monospace;
    background:transparent;
    border:2px solid var(--cyan);
    color:var(--cyan);
    padding:12px 34px;
    font-size:16px; letter-spacing:3px; text-transform:uppercase;
    cursor:pointer;
    text-shadow:0 0 6px var(--cyan);
    box-shadow:0 0 10px rgba(0,240,255,0.4), inset 0 0 10px rgba(0,240,255,0.15);
    border-radius:2px;
    transition:transform 0.12s ease;
    pointer-events:all;
  }
  .btn:active{ transform:scale(0.95); }
  .btn.magenta{
    border-color:var(--magenta); color:var(--magenta);
    text-shadow:0 0 6px var(--magenta);
    box-shadow:0 0 10px rgba(255,46,151,0.4), inset 0 0 10px rgba(255,46,151,0.15);
  }
  .finalscore{
    font-size:clamp(20px,5vw,30px);
    color:var(--yellow);
    text-shadow:0 0 10px var(--yellow);
    margin:0;
  }
  .hint{
    color:#9b8cc9; font-size:12px; letter-spacing:1px; max-width:320px;
  }

  /* ---------- Touch controls ---------- */
  #touchControls{
    position:absolute; bottom:18px; left:0; right:0;
    display:flex; justify-content:space-between; padding:0 18px;
    pointer-events:none;
  }
  #touchControls.active{ display:flex; }
  .tbtn{
    pointer-events:all;
    width:72px; height:72px;
    border-radius:50%;
    border:2px solid var(--magenta);
    background:rgba(255,46,151,0.08);
    color:var(--magenta);
    font-size:28px;
    display:flex; align-items:center; justify-content:center;
    text-shadow:0 0 8px var(--magenta);
    box-shadow:0 0 12px rgba(255,46,151,0.35);
  }
  .tbtn:active{ background:rgba(255,46,151,0.25); }

  @media (min-width:900px){
    #touchControls{ display:none !important; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-block">
      <div>Score</div>
      <div class="hud-value" id="scoreVal">0</div>
    </div>
    <div class="hud-block right">
      <div>Speed</div>
      <div class="hud-value" id="speedVal">0</div>
    </div>
  </div>

  <div id="startOverlay" class="overlay">
    <p class="subtitle">// synthwave arcade //</p>
    <h1 class="title">NEON DRIFT</h1>
    <p class="hint">Dodge the oncoming traffic and survive the neon highway. Use ← → or A / D on desktop, or the glowing buttons / swipe on mobile.</p>
    <button class="btn" id="startBtn">Start Engine</button>
  </div>

  <div id="overOverlay" class="overlay hidden">
    <p class="subtitle">// wasted //</p>
    <h1 class="title" style="font-size:clamp(24px,7vw,40px)">CRASHED</h1>
    <p class="finalscore" id="finalScore">0</p>
    <button class="btn magenta" id="retryBtn">Retry</button>
  </div>

  <div id="touchControls">
    <div class="tbtn" id="leftBtn">◀</div>
    <div class="tbtn" id="rightBtn">▶</div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ---------- Responsive sizing ----------
  // Fixed logical resolution, scaled to fit any device (phone, tablet, desktop).
  const LOGICAL_W = 480;
  const LOGICAL_H = 800;
  canvas.width = LOGICAL_W;
  canvas.height = LOGICAL_H;

  function resize(){
    const availW = window.innerWidth;
    const availH = window.innerHeight;
    const scale = Math.min(availW / LOGICAL_W, availH / LOGICAL_H);
    canvas.style.width = (LOGICAL_W * scale) + 'px';
    canvas.style.height = (LOGICAL_H * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // ---------- Road geometry ----------
  const ROAD_W = LOGICAL_W * 0.68;
  const ROAD_X = (LOGICAL_W - ROAD_W) / 2;
  const LANES = 3;
  const LANE_W = ROAD_W / LANES;
  const HORIZON = LOGICAL_H * 0.42;   // y where the road vanishes into the horizon
  const TOP_W = ROAD_W * 0.28;        // road width at the horizon (narrow, far away)
  const PERSPECTIVE_POW = 2.2;        // how sharply the road widens as it nears the camera

  function laneCenter(i){ return ROAD_X + LANE_W * i + LANE_W / 2; }

  // t: 0 = far away at the horizon, 1 = right in front of the camera.
  function roadYAt(t){ return HORIZON + Math.pow(t, PERSPECTIVE_POW) * (LOGICAL_H - HORIZON); }
  function roadWidthAt(t){ return TOP_W + (ROAD_W - TOP_W) * t; }
  function laneXAt(t, lane){
    const w = roadWidthAt(t);
    return LOGICAL_W/2 - w/2 + (w/LANES) * (lane + 0.5);
  }
  // Inverse of roadYAt: given a screen y (>= HORIZON), find how "close" (t) that is.
  function tForY(y){
    const t = (y - HORIZON) / (LOGICAL_H - HORIZON);
    return Math.pow(Math.max(0, Math.min(1, t)), 1/PERSPECTIVE_POW);
  }

  // ---------- Game state ----------
  let state = 'start'; // start | playing | over
  let score = 0;
  let speed = 0;
  const MAX_SPEED = 460;
  const ACCEL = 40;

  const player = {
    lane: 1,
    x: laneCenter(1),
    y: LOGICAL_H - 130,
    w: 44,
    h: 74,
    targetX: laneCenter(1)
  };

  let obstacles = [];
  let spawnTimer = 0;
  let roadOffset = 0;
  let particles = [];
  let shake = 0;

  function resetGame(){
    score = 0;
    speed = 140;
    player.lane = 1;
    player.x = laneCenter(1);
    player.targetX = player.x;
    obstacles = [];
    spawnTimer = 0;
    particles = [];
    shake = 0;
  }

  // ---------- Input ----------
  const keys = {};
  window.addEventListener('keydown', e=>{
    keys[e.key] = true;
    if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key)) e.preventDefault();
    if(state === 'playing'){
      if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
      if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
    }
  }, {passive:false});
  window.addEventListener('keyup', e=>{ keys[e.key] = false; });

  let lastMoveTime = 0;
  function moveLane(dir){
    const now = performance.now();
    if(now - lastMoveTime < 140) return; // debounce so key-repeat doesn't skip lanes
    lastMoveTime = now;
    const newLane = Math.max(0, Math.min(LANES-1, player.lane + dir));
    player.lane = newLane;
    player.targetX = laneCenter(newLane);
  }

  // touch buttons
  document.getElementById('leftBtn').addEventListener('touchstart', e=>{e.preventDefault(); if(state==='playing') moveLane(-1);}, {passive:false});
  document.getElementById('rightBtn').addEventListener('touchstart', e=>{e.preventDefault(); if(state==='playing') moveLane(1);}, {passive:false});
  document.getElementById('leftBtn').addEventListener('click', ()=>{ if(state==='playing') moveLane(-1); });
  document.getElementById('rightBtn').addEventListener('click', ()=>{ if(state==='playing') moveLane(1); });

  // swipe support directly on canvas
  let touchStartX = null;
  canvas.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
  canvas.addEventListener('touchend', e=>{
    if(touchStartX === null || state !== 'playing') return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 30){ moveLane(dx > 0 ? 1 : -1); }
    touchStartX = null;
  }, {passive:true});

  // ---------- UI wiring ----------
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const scoreVal = document.getElementById('scoreVal');
  const speedVal = document.getElementById('speedVal');
  const finalScoreEl = document.getElementById('finalScore');

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  function startGame(){
    resetGame();
    state = 'playing';
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
  }

  function gameOver(){
    state = 'over';
    finalScoreEl.textContent = 'Score: ' + Math.floor(score);
    overOverlay.classList.remove('hidden');
    shake = 18;
  }

  // ---------- Obstacle spawning ----------
  function spawnObstacle(){
    const lane = Math.floor(Math.random() * LANES);
    const colors = ['#ff2e97', '#00f0ff', '#ffe14d', '#7b2ff7'];
    obstacles.push({
      lane,
      y: HORIZON,        // cars appear right at the vanishing point, on the road
      baseW: 46,
      baseH: 78,
      // filled in each frame from y via perspective (see update()):
      x: laneXAt(0, lane),
      w: 0, h: 0,
      color: colors[Math.floor(Math.random()*colors.length)]
    });
  }

  // ---------- Particles (player trail) ----------
  function spawnParticle(){
    particles.push({
      x: player.x + (Math.random()-0.5)*20,
      y: player.y + player.h/2,
      life: 1,
      vy: 2 + Math.random()*2
    });
  }

  // ---------- Update ----------
  let lastTime = performance.now();
  function update(dt){
    if(state !== 'playing') return;

    speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
    score += dt * (speed / 10);

    // smooth lane change
    player.x += (player.targetX - player.x) * Math.min(1, dt * 10);

    roadOffset += speed * dt;

    spawnTimer -= dt;
    const spawnRate = Math.max(0.45, 1.15 - speed/500);
    if(spawnTimer <= 0){
      spawnObstacle();
      spawnTimer = spawnRate;
    }

    for(let i = obstacles.length - 1; i >= 0; i--){
      const o = obstacles[i];
      o.y += speed * dt * (0.35 + 0.65 * tForY(o.y)); // cars accelerate visually as they near the camera
      if(o.y > LOGICAL_H + 100) obstacles.splice(i, 1);

      // place the car on the road using the same perspective math as the lane markings
      const t = tForY(o.y);
      const scale = 0.3 + 0.7 * t;
      o.x = laneXAt(t, o.lane);
      o.w = o.baseW * scale;
      o.h = o.baseH * scale;

      // collision (AABB, slightly forgiving)
      if(Math.abs(o.x - player.x) < (o.w + player.w) / 2 - 14 &&
         Math.abs(o.y - player.y) < (o.h + player.h) / 2 - 10){
        gameOver();
      }
    }

    if(Math.random() < 0.6) spawnParticle();
    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.y += p.vy + speed*dt*0.3;
      p.life -= dt * 1.6;
      if(p.life <= 0) particles.splice(i, 1);
    }

    if(shake > 0) shake = Math.max(0, shake - dt*40);

    scoreVal.textContent = Math.floor(score);
    speedVal.textContent = Math.floor(speed/4);
  }

  // ---------- Drawing ----------
  function drawBackground(){
    // sky gradient
    const g = ctx.createLinearGradient(0,0,0,LOGICAL_H*0.55);
    g.addColorStop(0, '#1a0b3d');
    g.addColorStop(1, '#3d1a6b');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,LOGICAL_W, LOGICAL_H*0.42);

    // sun
    const sunY = LOGICAL_H*0.30;
    const sunR = 90;
    const sg = ctx.createLinearGradient(0, sunY-sunR, 0, sunY+sunR);
    sg.addColorStop(0, '#ff6ad5');
    sg.addColorStop(1, '#ffb347');
    ctx.save();
    ctx.beginPath();
    ctx.arc(LOGICAL_W/2, sunY, sunR, 0, Math.PI*2);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = sg;
    ctx.fillRect(LOGICAL_W/2 - sunR, sunY - sunR, sunR*2, sunR*2);
    // sun scanlines
    ctx.fillStyle = 'rgba(26,11,61,0.9)';
    for(let i=0;i<6;i++){
      const yy = sunY - sunR + 30 + i*22;
      ctx.fillRect(LOGICAL_W/2 - sunR, yy, sunR*2, 6);
    }
    ctx.restore();

    // ground
    const groundTop = LOGICAL_H*0.42;
    const gg = ctx.createLinearGradient(0, groundTop, 0, LOGICAL_H);
    gg.addColorStop(0, '#160a2e');
    gg.addColorStop(1, '#050216');
    ctx.fillStyle = gg;
    ctx.fillRect(0, groundTop, LOGICAL_W, LOGICAL_H - groundTop);

    // horizontal grid lines (perspective)
    ctx.strokeStyle = 'rgba(0,240,255,0.35)';
    ctx.lineWidth = 1;
    const horizon = HORIZON;
    for(let i=0;i<14;i++){
      const t = i/14;
      const y = roadYAt(t);
      ctx.globalAlpha = 1 - t*0.5;
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.lineTo(LOGICAL_W,y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // vertical perspective grid lines converging to horizon center
    const cx = LOGICAL_W/2;
    ctx.strokeStyle = 'rgba(123,47,247,0.4)';
    for(let i=-7;i<=7;i++){
      ctx.beginPath();
      ctx.moveTo(cx, horizon);
      ctx.lineTo(cx + i*70, LOGICAL_H);
      ctx.stroke();
    }
  }

  function drawRoad(){
    const topW = TOP_W;
    const topX = LOGICAL_W/2 - topW/2;
    const horizon = HORIZON;

    // road surface (trapezoid)
    ctx.beginPath();
    ctx.moveTo(topX, horizon);
    ctx.lineTo(topX+topW, horizon);
    ctx.lineTo(ROAD_X+ROAD_W, LOGICAL_H);
    ctx.lineTo(ROAD_X, LOGICAL_H);
    ctx.closePath();
    ctx.fillStyle = '#0d0620';
    ctx.fill();

    // road edge glow
    ctx.strokeStyle = 'var(--cyan)';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(topX, horizon); ctx.lineTo(ROAD_X, LOGICAL_H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(topX+topW, horizon); ctx.lineTo(ROAD_X+ROAD_W, LOGICAL_H);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // lane dashes, scrolling with roadOffset, drawn with perspective interpolation
    ctx.strokeStyle = 'rgba(255,46,151,0.85)';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ff2e97';
    ctx.shadowBlur = 8;
    for(let lane=1; lane<LANES; lane++){
      const segCount = 10;
      for(let s=0; s<segCount; s++){
        let t = ((s/segCount) + (roadOffset*0.0016) % (1/segCount)) % 1;
        const t2 = Math.min(1, t + 0.05);
        const yA = horizon + Math.pow(t,2.2)*(LOGICAL_H-horizon);
        const yB = horizon + Math.pow(t2,2.2)*(LOGICAL_H-horizon);
        const wA = topW + (ROAD_W-topW)*t;
        const wB = topW + (ROAD_W-topW)*t2;
        const xA = LOGICAL_W/2 - wA/2 + (wA/LANES)*lane;
        const xB = LOGICAL_W/2 - wB/2 + (wB/LANES)*lane;
        ctx.beginPath();
        ctx.moveTo(xA,yA);
        ctx.lineTo(xB,yB);
        ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;
  }

  function drawCar(x, y, w, h, bodyColor, glowColor, flip){
    // Top-down car silhouette: nose at top (-h/2), tail at bottom (+h/2).
    // Oncoming traffic (flip=true) is rotated 180° so its nose faces the player.
    ctx.save();
    ctx.translate(x,y);
    if(flip) ctx.rotate(Math.PI);

    // rear spoiler
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 10;
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-w*0.42, h*0.40, w*0.84, h*0.07);

    // wheels (four dark blocks peeking out from the body sides)
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#050208';
    const wheelW = w*0.14, wheelH = h*0.2;
    ctx.fillRect(-w/2 - wheelW*0.35, -h*0.28, wheelW, wheelH); // front-left
    ctx.fillRect( w/2 - wheelW*0.65, -h*0.28, wheelW, wheelH); // front-right
    ctx.fillRect(-w/2 - wheelW*0.35,  h*0.06, wheelW, wheelH); // rear-left
    ctx.fillRect( w/2 - wheelW*0.65,  h*0.06, wheelW, wheelH); // rear-right

    // main body: tapered nose, wide haunches, tucked tail
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 18;
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(0, -h/2);                 // nose tip
    ctx.lineTo(w*0.30, -h*0.30);         // right shoulder
    ctx.lineTo(w*0.40, h*0.08);          // right haunch (widest point)
    ctx.lineTo(w*0.28, h*0.42);          // right tail
    ctx.lineTo(-w*0.28, h*0.42);         // left tail
    ctx.lineTo(-w*0.40, h*0.08);         // left haunch
    ctx.lineTo(-w*0.30, -h*0.30);        // left shoulder
    ctx.closePath();
    ctx.fill();

    // racing stripe down the centre
    ctx.shadowBlur = 4;
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillRect(-w*0.06, -h*0.46, w*0.12, h*0.86);

    // windshield / cockpit
    ctx.shadowBlur = 6;
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.moveTo(-w*0.20, -h*0.16);
    ctx.lineTo(w*0.20, -h*0.16);
    ctx.lineTo(w*0.15, h*0.06);
    ctx.lineTo(-w*0.15, h*0.06);
    ctx.closePath();
    ctx.fill();

    // headlights (nose) and taillights (tail)
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-w*0.24, -h*0.42, w*0.14, h*0.06);
    ctx.fillRect( w*0.10, -h*0.42, w*0.14, h*0.06);
    ctx.fillStyle = glowColor;
    ctx.fillRect(-w*0.24, h*0.32, w*0.14, h*0.06);
    ctx.fillRect( w*0.10, h*0.32, w*0.14, h*0.06);

    ctx.restore();
  }

  function draw(){
    ctx.save();
    if(shake > 0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    drawBackground();
    drawRoad();

    // particles (trail)
    particles.forEach(p=>{
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // obstacles
    obstacles.forEach(o=>{
      drawCar(o.x, o.y, o.w, o.h, '#1a0b3d', o.color, true);
    });

    // player
    drawCar(player.x, player.y, player.w, player.h, '#160a2e', state==='over' ? '#ff2e97' : '#00f0ff');

    ctx.restore();
  }

  // ---------- Main loop ----------
  function loop(now){
    const dt = Math.min(0.05, (now - lastTime)/1000);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // idle background animation before game starts
  draw();

})();
</script>
</body>
</html>
